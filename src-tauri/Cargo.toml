[package]
name = "tandem"
version = "1.0.0"
description = "Play your PC's audio on several outputs at once, in sync"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["V. Douay"]

[lib]
name = "tandem_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.27.0"
tandem-engine = { path = "../engine" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Globalization"] }
