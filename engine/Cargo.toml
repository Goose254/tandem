[package]
name = "tandem-engine"
version = "1.0.2"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Goose254/tandem"
homepage = "https://github.com/Goose254/tandem"
authors = ["V. Douay"]
description = "Mirror Windows system audio to several outputs, delayed and drift-corrected"

[lib]
name = "tandem_engine"

[[bin]]
name = "tandem-cli"
path = "src/bin/tandem-cli.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line tool's own dependencies. The desktop app turns this off.
cli = ["dep:clap", "dep:crossterm"]

[dependencies]
anyhow = "1.0.104"
audioadapter-buffers = "5.1"
clap = { version = "4.6.7", features = ["derive"], optional = true }
crossterm = { version = "0.29.0", optional = true }
rubato = "5.0.1"
rustfft = "6"
wasapi = "0.27.0"
# Same version as `wasapi`, so its COM types are the ones used here.
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Threading",
] }
