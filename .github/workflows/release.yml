name: Release

# Pushing a tag like v1.0.2 builds the signed installer and publishes a GitHub release with it
# and the update feed (latest.json). The release is public as soon as the run succeeds, and
# installed copies of Tandem offer it on their next check: the tag is the release decision.
# The notes come from docs/release-notes.md. Full procedure: docs/RELEASING.md.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the update signing key (see README, "Releases")
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password; leave unset for a key without one
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the app version $version" >&2
            exit 1
          fi

      - name: Check that the update signing key is set
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "The TAURI_SIGNING_PRIVATE_KEY secret is missing: updates could not be signed." >&2
            exit 1
          fi

      # The notes for this version: shown on the release page and, through latest.json, in
      # the app's update card.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<TANDEM_NOTES_END'
            cat docs/release-notes.md
            echo
            echo 'TANDEM_NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - run: cargo test --release -p tandem-engine

      # Builds, signs, creates the release and uploads the installer, its signature and
      # latest.json (the feed the in-app updater reads).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tandem ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
