name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type-check, build the UI, test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # This action installs the minimal profile, so rustfmt has to be asked for.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      # Formatting only, no compilation: fails fast before the long steps.
      - run: cargo fmt --all --check

      - run: npm ci

      - run: npm run lint

      # Type-checks and produces dist/, which the desktop crate embeds at compile time.
      - run: npm run build

      - run: cargo test --release
